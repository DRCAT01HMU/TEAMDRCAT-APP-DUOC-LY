    <script>
        // Disable Right Click
        document.addEventListener('contextmenu', event => event.preventDefault());
        
        // Disable Text Selection and Copy
        document.addEventListener('selectstart', event => event.preventDefault());
        document.addEventListener('copy', event => {
            event.preventDefault();
            alert("Tài liệu nội bộ: Không được phép sao chép!");
            if (event.clipboardData) {
                event.clipboardData.setData('text/plain', 'Tài liệu bản quyền TEAMDRCAT');
            }
        });
        
        // Disable DevTools shortcuts & Print
        document.addEventListener('keydown', function(e) {
            // F12
            if(e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I / J / C
            if(e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U (View Source)
            if(e.ctrlKey && e.key.toUpperCase() === 'U') {
                e.preventDefault();
                return false;
            }
            // Ctrl+P (Print)
            if(e.ctrlKey && e.key.toUpperCase() === 'P') {
                e.preventDefault();
                return false;
            }
            // Ctrl+S (Save)
            if(e.ctrlKey && e.key.toUpperCase() === 'S') {
                e.preventDefault();
                return false;
            }
        });
        
        // Anti-Debugging
        setInterval(function() {
            var before = new Date().getTime();
            debugger;
            var after = new Date().getTime();
            if (after - before > 100) {
                // User has DevTools open
                document.body.innerHTML = "<div style='text-align:center; padding: 50px; font-family: sans-serif; font-weight: bold;'>Please close Developer Tools to continue using this application.</div>";
            }
        }, 1000);
    </script>

<script>
window.customConfirmDialog = function(msg, onConfirm) {
    const overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 bg-slate-900/80 z-[99999] flex items-center justify-center backdrop-blur-sm transition-opacity duration-300';
    overlay.style.opacity = '0';
    
    const dialog = document.createElement('div');
    dialog.className = 'bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-[2rem] shadow-2xl max-w-sm w-[90%] mx-auto transform transition-all duration-300 border border-slate-200 dark:border-slate-700 scale-95 opacity-0';
    
    const iconContainer = document.createElement('div');
    iconContainer.className = 'w-16 h-16 bg-violet-100 dark:bg-violet-900/50 rounded-full flex items-center justify-center mx-auto mb-4 text-violet-600 dark:text-violet-400 shadow-inner';
    iconContainer.innerHTML = '<i class="fa-solid fa-circle-question text-3xl"></i>';
    
    const title = document.createElement('h3');
    title.className = 'text-xl font-black text-slate-800 dark:text-white mb-2 text-center uppercase tracking-wider';
    title.innerText = 'Xác nhận';
    
    const message = document.createElement('p');
    message.className = 'text-slate-500 dark:text-slate-400 text-center mb-8 font-medium text-sm sm:text-base';
    message.innerText = msg;
    
    const btnContainer = document.createElement('div');
    btnContainer.className = 'flex gap-3 justify-center';
    
    const btnCancel = document.createElement('button');
    btnCancel.className = 'flex-1 px-5 py-3 rounded-xl font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all active:scale-95';
    btnCancel.innerText = 'Hủy';
    btnCancel.onclick = () => {
        overlay.style.opacity = '0';
        dialog.classList.remove('scale-100', 'opacity-100');
        dialog.classList.add('scale-95', 'opacity-0');
        setTimeout(() => { if(document.body.contains(overlay)) document.body.removeChild(overlay); }, 300);
    };
    
    const btnConfirm = document.createElement('button');
    btnConfirm.className = 'flex-1 px-5 py-3 rounded-xl font-bold bg-gradient-to-r from-blue-500 to-cyan-500 text-white hover:from-blue-600 hover:to-cyan-600 shadow-md transition-all active:scale-95 shadow-violet-500/30';
    btnConfirm.innerText = 'Đồng ý';
    btnConfirm.onclick = () => {
        overlay.style.opacity = '0';
        dialog.classList.remove('scale-100', 'opacity-100');
        dialog.classList.add('scale-95', 'opacity-0');
        setTimeout(() => { if(document.body.contains(overlay)) document.body.removeChild(overlay); }, 300);
        if(onConfirm) onConfirm();
    };
    
    btnContainer.appendChild(btnCancel);
    btnContainer.appendChild(btnConfirm);
    
    dialog.appendChild(iconContainer);
    dialog.appendChild(title);
    dialog.appendChild(message);
    dialog.appendChild(btnContainer);
    overlay.appendChild(dialog);
    
    document.body.appendChild(overlay);
    
    // Trigger animations
    requestAnimationFrame(() => {
        overlay.style.opacity = '1';
        dialog.classList.remove('scale-95', 'opacity-0');
        dialog.classList.add('scale-100', 'opacity-100');
    });
};
</script>

<script type="text/babel">

const { useState, useEffect, useRef } = React;

function parseQuizData(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(l => l);
    const questions = [];
    let currentQ = null;
    let currentMode = 'context';
    let currentContext = "";
    let isBuildingContext = false;

    lines.forEach(line => {
        line = line.replace(/^[\u2022\u00b7\-\*]\s*/, '').trim();
        if (!line) return;

        const isSection = line.match(/^(?:PHẦN|Phần)\s+[I|V|X|\d]+/i);
        if (isSection) {
            currentContext = "";
            isBuildingContext = false;
        }

        const isCaseStart = line.match(/^(?:TÌNH HUỐNG LÂM SÀNG|Case lâm sàng|Tình huống|Case\s*\d+)/i);
        const isQ = line.match(/^(?:Câu|Question)[^\d]*([\d\.]+)(?:[^a-z0-9]*[:\.\-])?\s*(.*)/i);
        const isOpt = line.match(/^\(?([A-E])\)?[\.\)\:\-\/]\s*(.*)/i);
        const isAns = line.match(/^(?:Đáp án(?: đúng)?|Answer)\s*[:\.\-]?\s*\(?([A-E])\)?/i);

        if (isCaseStart && !isQ) {
            if (currentMode === 'question') {
                currentQ.question += (currentQ.question ? '\n' : '') + line;
                return;
            }
            currentContext = line + '\n';
            isBuildingContext = true;
            currentMode = 'context';
            return;
        }

        if (isQ && !isAns) {
            isBuildingContext = false;
            if (currentQ) questions.push(currentQ);
            
            currentQ = { 
                id: questions.length + 1, 
                originalId: isQ[1], 
                context: currentContext.trim(), 
                question: isQ[2] || '', 
                options: {}, 
                answer: '' 
            };
            currentMode = 'question';
            return;
        }

        if (isAns && currentQ) {
            currentQ.answer = isAns[1].toUpperCase();
            currentMode = 'skip';
            return;
        }
        
        if (line.match(/^(Giải thích|Tại sao các lựa chọn khác|Tài liệu được biên soạn|Nghiêm cấm sao chép|Đúng:|Sai:|Đáp án và Giải thích)/i)) {
            currentMode = 'skip';
            return;
        }

        if (currentMode === 'skip') return;

        if (isBuildingContext) {
            if (!line.match(/^(TRẮC NGHIỆM|BASEDOW|BỆNH LÝ BASEDOW|HỘI CHỨNG|ĐỘT QUỴ|ĐỘNG KINH|COPD|ĐÁI MÁU|NỘI KHOA|TEAMDRCAT|==========|Tài liệu được|Nghiêm cấm|\[🛑)/i)) {
                currentContext += line + '\n';
            }
            return;
        }

        if (currentQ) {
            if (isOpt) {
                currentQ.options[isOpt[1].toUpperCase()] = isOpt[2].trim();
                currentMode = 'options';
            } else if (currentMode === 'question') {
                currentQ.question += '\n' + line;
            } else if (currentMode === 'options') {
                const keys = Object.keys(currentQ.options);
                if (keys.length > 0) {
                    const lastKey = keys[keys.length - 1];
                    currentQ.options[lastKey] += '\n' + line;
                }
            } 
        }
    });
    if (currentQ) questions.push(currentQ);

    const mergedQuestions = [];
    questions.forEach(q => {
        const isAnswerKey = Object.keys(q.options).length === 0 && !q.context;
        if (isAnswerKey) {
            const existingQ = mergedQuestions.find(mq => mq.originalId === q.originalId && !mq.answer);
            if (existingQ) {
                if (q.answer) existingQ.answer = q.answer;
                return;
            }
        }
        mergedQuestions.push(q);
    });
    mergedQuestions.forEach((q, idx) => { q.id = idx + 1; });
    questions.length = 0;
    mergedQuestions.forEach(q => questions.push(q));

    const cln = (s) => (s||'').replace(/\\n\\n/gi, ' ').replace(/\\n/gi, ' ').trim();
    questions.forEach(q => { if(q.context) q.context=cln(q.context); if(q.question) q.question=cln(q.question); for(let k in q.options) q.options[k]=cln(q.options[k]); });
    return questions;
}

const playCorrectSound = () => {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.15);
    } catch (e) { console.error(e); }
};

const playIncorrectSound = () => {

                            <div className="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center  shadow-inner shrink-0">
                                <i className="fa-solid fa-paper-plane text-xl"></i>
                            </div>

    const handleUnlock = () => {

    if (appState === 'locked') {
        return (
            <div className="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden bg-transparent z-40 text-center animate-in fade-in duration-500">

                    {pwError && <p className="text-red-500 text-xs font-bold uppercase mb-4 tracking-widest flex items-center justify-center gap-2 animate-in slide-in-from-top-1"><i className="fa-solid fa-triangle-exclamation"></i> Mật khẩu chưa đúng</p>}
                    
                    <button onClick={handleUnlock} className="w-full btn-gradient text-white text-lg font-black py-4 rounded-2xl flex items-center justify-center gap-3 shadow-lg  transition-all border border-white/20">
                        <i className="fa-solid fa-key"></i> Xác nhận
                    </button>
                    <p className="mt-8 text-[10px] font-black text-slate-400 uppercase tracking-widest opacity-80">Tài liệu nội bộ TEAMDRCAT</p>
                </div>
            </div>
        );
    }

    if (appState === 'unlocking') {
        return (
            <div className="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden bg-transparent z-40 text-center">
                <div key={unlockCountdown} className="animate-heartbeat flex flex-col items-center justify-center" style={{ animationDuration: '1s' }}>
                    <div className="text-[180px] md:text-[220px] font-black leading-none bg-clip-text text-transparent bg-gradient-to-b from-violet-400 to-fuchsia-500 drop-shadow-[0_0_40px_rgba(37,99,235,0.8)] filter">

    if (appState === 'intro') {
        return (
            <div className="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden bg-transparent">
                

                <div className="absolute top-4 right-4 z-50 flex gap-3">
                    <div className="relative group">
                        <button className="p-2 sm:p-3 glass-panel shadow-lg rounded-full hover:bg-white/90 dark:hover:bg-slate-700/90 transition-all duration-300 text-slate-600 dark:text-slate-300 hover:scale-110">

                        <div className="absolute right-0 mt-2 w-48 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md rounded-2xl shadow-2xl border border-white/50 dark:border-slate-700/50 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50 flex flex-col p-2 translate-y-2 group-hover:translate-y-0">
                            <button onClick={() => setIsSoundEnabled(!isSoundEnabled)} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors">
                                {isSoundEnabled ? <><i className="fa-solid fa-volume-high text-blue-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Tắt âm</span></> : <><i className="fa-solid fa-volume-xmark text-slate-400 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Bật âm</span></>}
                            </button>
                            <button onClick={() => setZoomLevel(prev => Math.min(prev + 10, 150))} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors">
                                <i className="fa-solid fa-magnifying-glass-plus text-emerald-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Phóng to</span>
                            </button>
                            <button onClick={() => setZoomLevel(prev => Math.max(prev - 10, 50))} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors">
                                <i className="fa-solid fa-magnifying-glass-minus text-emerald-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Thu nhỏ</span>
                            </button>
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors border-t border-slate-100 dark:border-slate-700/50 mt-1 pt-3">
                                {isDarkMode ? <><i className="fa-solid fa-sun text-amber-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Nền Sáng</span></> : <><i className="fa-solid fa-moon text-blue-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Nền Tối</span></>}
                            </button>
                        </div>
                    </div>
                </div>
                <div className="max-w-4xl xl:max-w-5xl w-full glass-panel rounded-[2.5rem] shadow-2xl overflow-hidden relative z-10 border-t border-l border-white/80 dark:border-slate-700/50 animate-in fade-in slide-in-from-bottom-8 duration-700">
                    <div className="p-12 pb-8 flex flex-col items-center text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-blue-500/10 to-cyan-600/10 dark:from-blue-900/20 dark:to-cyan-900/20 pointer-events-none"></div>
                        <div className="w-24 h-24 bg-white dark:bg-slate-800 rounded-full mb-6 shadow-xl border border-violet-100 dark:border-slate-700 flex items-center justify-center relative group">
                            <div className="absolute inset-0 bg-blue-400 rounded-full opacity-20 group-hover:scale-150 transition-transform duration-700"></div>
                            <i className="fa-solid fa-staff-snake text-5xl bg-clip-text text-transparent bg-gradient-to-br from-violet-500 to-fuchsia-600 drop-shadow-sm text-rose-500"></i>
                        </div>
                        <h1 className="text-3xl sm:text-4xl md:text-5xl font-black uppercase tracking-tighter mb-3 z-10 bg-clip-text text-transparent bg-gradient-to-r from-violet-600 to-fuchsia-600 dark:from-blue-400 dark:to-cyan-400 drop-shadow-sm">TRẮC NGHIỆM DƯỢC LÝ</h1>
                        <p className="text-violet-700 dark:text-violet-300 text-lg font-bold tracking-widest uppercase z-10 opacity-80">CHUYÊN ĐỀ: {diseaseName}</p>
                    </div>
                    <div className="p-10 pt-2 bg-white/40 dark:bg-slate-900/85 ">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                            <div className="flex items-center gap-4 bg-white/70 dark:bg-slate-800/70 p-5 rounded-2xl border border-white/50 dark:border-slate-700/50 shadow-sm transition-transform duration-300  ">
                                <div className="bg-violet-100 dark:bg-violet-900/50 w-12 h-12 flex items-center justify-center rounded-xl text-violet-600 dark:text-violet-400 shadow-inner"><i className="fa-solid fa-layer-group text-xl"></i></div>
                                <div><p className="text-[10px] text-slate-500 dark:text-slate-400 font-black uppercase tracking-widest mb-1">Tổng câu hỏi</p><p className="text-2xl font-black text-slate-800 dark:text-slate-100 leading-none">{questions.length}</p></div>
                            </div>
                            <div className="flex items-center gap-4 bg-white/70 dark:bg-slate-800/70 p-5 rounded-2xl border border-white/50 dark:border-slate-700/50 shadow-sm transition-transform duration-300  ">
                                <div className="bg-fuchsia-100 dark:bg-fuchsia-900/50 w-12 h-12 flex items-center justify-center rounded-xl text-fuchsia-600 dark:text-fuchsia-400 shadow-inner"><i className="fa-regular fa-hourglass-half text-xl"></i></div>
                                <div><p className="text-[10px] text-slate-500 dark:text-slate-400 font-black uppercase tracking-widest mb-1">Thời gian</p><p className="text-2xl font-black text-slate-800 dark:text-slate-100 leading-none">{questions.length} Phút</p></div>
                            </div>
                        </div>
                        <div className="bg-violet-50/80 dark:bg-violet-900/20 rounded-2xl p-6 mb-10 border border-violet-100 dark:border-violet-800/30 flex items-start gap-4 text-violet-900 dark:text-violet-100 shadow-inner">
                            <i className="fa-solid fa-circle-info shrink-0 mt-0.5 text-2xl text-fuchsia-600 dark:text-fuchsia-400"></i>
                            <div className="text-base leading-relaxed font-medium">
                                <p className="font-bold mb-3 text-fuchsia-800 dark:text-fuchsia-300 text-lg">Hướng dẫn làm bài:</p>
                                <ul className="list-disc pl-5 space-y-2 opacity-90 marker:text-fuchsia-600 dark:marker:text-fuchsia-400">
                                    <li>Kết quả đúng/sai sẽ hiển thị <strong className="text-fuchsia-900 dark:text-fuchsia-200 font-bold">ngay lập tức</strong> khi chọn.</li>
                                    <li>Khi đã chọn, bạn <strong className="text-fuchsia-900 dark:text-fuchsia-200 font-bold">không thể thay đổi</strong> đáp án của câu đó.</li>
                                    <li>Sử dụng nút <strong className="text-fuchsia-900 dark:text-fuchsia-200 font-bold">Đánh dấu cờ</strong> để lưu lại những câu khó.</li>
                                    <li><i className="fa-solid fa-keyboard mr-1 opacity-70"></i> Phím tắt điểu khiển: Ghép <strong className="text-fuchsia-900 dark:text-fuchsia-200 font-bold">A, B, C, D</strong> để chọn; <strong className="text-fuchsia-900 dark:text-fuchsia-200 font-bold">Mũi tên</strong> để chuyển câu; <strong className="text-fuchsia-900 dark:text-fuchsia-200 font-bold">Phím Space</strong> để cắm cờ.</li>
                                    <li>Được biên soạn bởi <strong className="text-fuchsia-900 dark:text-fuchsia-200 font-bold">TEAMDRCAT</strong>.</li>
                                </ul>
                            </div>
                        </div>
                        <button onClick={startQuiz} className="w-full btn-gradient text-white text-xl font-black py-5 rounded-2xl transition-all duration-300 shadow-[0_10px_20px_-10px_rgba(37,99,235,0.6)] hover:shadow-[0_15px_25px_-10px_rgba(37,99,235,0.8)] flex items-center justify-center gap-3 uppercase tracking-widest  active:scale-95 border border-white/20">
                            <i className="fa-solid fa-rocket text-xl"></i> Bắt đầu ngay
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen flex flex-col md:flex-row relative transition-colors duration-1000 z-0">
            {showDrNote && (
                <div className="fixed z-[100] w-72 glass-panel shadow-2xl rounded-2xl overflow-hidden border border-rose-500/50" style={{ right: '2rem', bottom: '2rem', animation: 'slideIn 0.3s ease-out' }} ref={(el) => { if(el && !el.dataset.dragInit) { el.dataset.dragInit = 'true'; el.style.transform = window._drNoteTransform || ''; } }}>
                    <div className="bg-gradient-to-r from-violet-600 to-fuchsia-600 px-4 py-3 flex justify-between items-center text-white cursor-move" style={{ touchAction: 'none' }} onPointerDown={(e) => { if(e.target.closest('button')) return; const el = e.currentTarget; const panel = el.parentElement; el.setPointerCapture(e.pointerId); const startX = e.clientX; const startY = e.clientY; const transformStr = panel.style.transform; let initialDx = 0, initialDy = 0; if(transformStr && transformStr.includes('translate(')) { const match = transformStr.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/); if(match) { initialDx = parseFloat(match[1]); initialDy = parseFloat(match[2]); } } const onMove = (moveEvent) => { const dx = initialDx + (moveEvent.clientX - startX); const dy = initialDy + (moveEvent.clientY - startY); const newTransform = `translate(${dx}px, ${dy}px)`; panel.style.transform = newTransform; window._drNoteTransform = newTransform; }; const onUp = () => { el.removeEventListener('pointermove', onMove); el.removeEventListener('pointerup', onUp); el.releasePointerCapture(e.pointerId); }; el.addEventListener('pointermove', onMove); el.addEventListener('pointerup', onUp); }}>
                        <span className="font-bold flex items-center gap-2"><i className="fa-solid fa-user-doctor"></i> Sổ tay Y lệnh</span>
                        <button onClick={() => setShowDrNote(false)} className="hover:text-red-200 transition-colors"><i className="fa-solid fa-xmark"></i></button>
                    </div>
                    <div className="p-0">
                        <textarea 
                            value={drNoteContent}
                            onChange={(e) => setDrNoteContent(e.target.value)}
                            placeholder="Ghi chú các thông số bất thường, chẩn đoán sơ bộ..."
                            className="w-full h-48 p-4 bg-yellow-50/90 dark:bg-yellow-900/20 text-slate-800 dark:text-slate-200 resize-none outline-none font-mono text-sm border-none focus:ring-0 custom-scrollbar"
                            style={{ backgroundImage: 'linear-gradient(transparent, transparent 27px, #cbd5e1 28px)', backgroundSize: '100% 28px', lineHeight: '28px' }}
                        ></textarea>
                    </div>
                </div>
            )}
            
            {showMatrix && <div className="fixed inset-0 bg-slate-900/95  z-40 md:hidden transition-opacity" onClick={() => setShowMatrix(false)}></div>}
            
            <aside className={`fixed md:sticky top-0 right-0 h-screen w-[85vw] max-w-[320px] md:max-w-none md:w-[400px] glass-panel z-50 flex flex-col transition-all duration-500 ease-in-out ${showMatrix ? 'translate-x-0' : 'translate-x-full'} ${isNavOpen ? 'md:translate-x-0 md:mr-0' : 'md:translate-x-full md:-mr-[400px]'} md:order-2 shadow-[-10px_0_30px_rgba(0,0,0,0.05)] dark:shadow-none border-l border-white/40 dark:border-slate-700/50`}>
                <div className="p-6 border-b border-slate-200/50 dark:border-slate-700/50 flex justify-between items-center bg-white/40 dark:bg-slate-800/90  sticky top-0 z-10">
                    <h2 className="font-black text-slate-800 dark:text-slate-100 flex items-center gap-3 uppercase tracking-tighter text-base"><div className="w-8 h-8 rounded-lg bg-violet-100 dark:bg-violet-900/50 flex items-center justify-center text-violet-600 dark:text-violet-400"><i className="fa-solid fa-grip"></i></div> Bảng câu hỏi</h2>
                    <button className="text-slate-500 p-2 bg-white/50 dark:bg-slate-700/50 rounded-full hover:bg-white dark:hover:bg-slate-600 transition-colors shadow-sm" onClick={() => { setShowMatrix(false); setIsNavOpen(false); }} title="Đóng Bảng Câu Hỏi"><i className="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div className="flex-1 overflow-y-auto p-6 custom-scrollbar grid grid-cols-5 gap-3 content-start">
                    {(showMatrix || window.innerWidth >= 768) && questions.map((q, i) => {
                        let navBtnClass = "h-12 w-full rounded-xl text-sm font-black border relative flex items-center justify-center active:scale-95 transition-transform duration-75 bg-white/60 dark:bg-slate-700/60 text-slate-500 border-white/50 dark:border-slate-600/50 dark:text-slate-300 shadow-sm  ";
                        if (!!answers[i]) {
                            if (answers[i] === q.answer) {
                                navBtnClass = "h-12 w-full rounded-xl text-sm font-black border-2 relative flex items-center justify-center active:scale-95 transition-transform duration-75 bg-green-100/90 dark:bg-green-900/60 text-green-700 dark:text-green-300 border-green-400/50 dark:border-green-600/50 shadow-sm ";
                            } else {
                                navBtnClass = "h-12 w-full rounded-xl text-sm font-black border-2 relative flex items-center justify-center active:scale-95 transition-transform duration-75 bg-red-100/90 dark:bg-red-900/60 text-red-700 dark:text-red-300 border-red-400/50 dark:border-red-600/50 shadow-sm ";
                            }
                        }
                        if (currentIndex === i && appState !== 'review') {
                            navBtnClass += " border-violet-500 bg-violet-100 will-change-transform scale-105 z-10";
                        }
                        if (flagged.has(i)) {
                            navBtnClass += " !border-orange-400 dark:!border-orange-500 !bg-orange-100/90 dark:!bg-orange-900/50 text-orange-700 dark:text-orange-400";
                        }
                        return (
                            <button 
                                key={i} 
                                onClick={() => { 
                                    if (appState === 'review') { 
                                        const target = document.getElementById(`review-q-${i}`); 
                                        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
                                    } else { 
                                        setCurrentIndex(i); 
                                    } 
                                    if (window.innerWidth < 768) setShowMatrix(false); 
                                }} 
                                className={navBtnClass}
                            >
                                {i + 1}
                                {flagged.has(i) && <div className="absolute -top-2 -right-2 w-5 h-5 bg-gradient-to-br from-orange-400 to-red-500 rounded-full border border-white dark:border-slate-800 shadow-md flex items-center justify-center text-white text-[10px]"><i className="fa-solid fa-flag"></i></div>}
                            </button>
                        );
                    })}
                </div>
                <div className="p-6 pb-28 border-t border-slate-200/50 dark:border-slate-700/50 bg-white/40 dark:bg-slate-800/90  z-10">

                    </div>
                    <div className="flex flex-wrap items-center justify-end gap-x-2 gap-y-3 sm:gap-4 ml-auto shrink-0" style={{ maxWidth: "calc(100vw - 120px)" }}>

                        <GoogleSearch />
                        
                        <div className="relative group">
                            <button className="p-2.5 bg-white/60 dark:bg-slate-700/60 rounded-xl hover:bg-white dark:hover:bg-slate-600 transition-colors text-slate-600 dark:text-slate-300 border border-white/40 dark:border-slate-600/50 shadow-sm">
                                <i className="fa-solid fa-gear text-lg"></i>
                            </button>
                            <div className="absolute right-0 mt-2 w-48 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md rounded-2xl shadow-2xl border border-white/50 dark:border-slate-700/50 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50 flex flex-col p-2 translate-y-2 group-hover:translate-y-0">
                                <button onClick={() => setIsSoundEnabled(!isSoundEnabled)} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors">

                                <button onClick={() => setZoomLevel(prev => Math.max(prev - 10, 50))} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors">

                                    {isDarkMode ? <><i className="fa-solid fa-sun text-amber-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Nền Sáng</span></> : <><i className="fa-solid fa-moon text-blue-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Nền Tối</span></>}

                        <button onClick={() => setShowDrNote(!showDrNote)} className="p-2.5 bg-yellow-100/80 dark:bg-yellow-900/50 rounded-xl hover:bg-yellow-200 dark:hover:bg-yellow-800 transition-colors text-yellow-700 dark:text-yellow-400 border border-yellow-300/50 dark:border-yellow-700/50 shadow-sm" title="Mở sổ tay">
                            <i className="fa-solid fa-notes-medical text-lg"></i>

                        {appState === 'quiz' && (
                            <React.Fragment>

                                    <i className={`fa-solid fa-heart-pulse text-xl ${timeRemaining < 120 ? 'animate-heartbeat-fast' : 'animate-heartbeat'}`}></i>
                                    {formatTime(timeRemaining)}
                                </div>
                                <button onClick={togglePause} className="p-2.5 bg-white/60 dark:bg-slate-700/60 rounded-xl hover:bg-white dark:hover:bg-slate-600 transition-colors text-violet-600 dark:text-violet-400 border border-white/40 dark:border-slate-600/50 shadow-sm">

                                </button>
                            </React.Fragment>
                        )}
                        {appState === 'review' && <div className="px-4 py-2 rounded-xl font-black bg-amber-100/90 dark:bg-amber-900/50 text-amber-700 dark:text-amber-400 flex items-center gap-2 border border-amber-300/50 dark:border-amber-700/50 shadow-sm"><i className="fa-solid fa-eye"></i> <span className="hidden sm:inline uppercase text-xs tracking-wider">Xem lại</span></div>}
                        <button className="hidden md:flex bg-white/60 dark:bg-slate-700/60 text-violet-600 dark:text-violet-400 p-2.5 rounded-xl items-center justify-center border border-white/40 dark:border-slate-600/50 shadow-sm transition-colors hover:bg-white dark:hover:bg-slate-600" onClick={() => setIsNavOpen(!isNavOpen)} title="Ẩn/Hiện Bảng Câu Hỏi"><i className="fa-solid fa-bars text-lg"></i></button>
                        <button className="md:hidden bg-white/60 dark:bg-slate-700/60 text-violet-600 dark:text-violet-400 p-2.5 rounded-xl flex items-center justify-center border border-white/40 dark:border-slate-600/50 shadow-sm" onClick={() => setShowMatrix(true)}><i className="fa-solid fa-bars text-lg"></i></button>
                    </div>
                </header>

                <div ref={scrollContainerRef} className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar relative z-0">
                    <div className="max-w-4xl mx-auto w-full pb-8">
                        {renderQuizContent()}
                    </div>
                </div>
            </main>
        </div>
    );
}


class ErrorBoundary extends React.Component {
    constructor(props) { super(props); this.state = { hasError: false, error: null, info: null }; }
    static getDerivedStateFromError(error) { return { hasError: true, error }; }
    componentDidCatch(error, info) { this.setState({ error, info }); console.error("REACT CRASH: ", error, info); }
    render() {
        if (this.state.hasError) {
            return (
                <div style={{padding: '40px', background: 'white', color: 'red', minHeight: '100vh', zIndex: 99999, position: 'relative'}}>
                    <h1 style={{fontSize: '24px', fontWeight: 'bold'}}>HỆ THỐNG GẶP LỖI (CRASH)</h1>
                    <p style={{marginTop: '10px'}}>{this.state.error && this.state.error.toString()}</p>
                    <pre style={{marginTop: '20px', background: '#ffebee', padding: '15px', borderRadius: '8px', overflow: 'auto', fontSize: '12px'}}>
                        {this.state.info && this.state.info.componentStack}
                    </pre>
                    <button onClick={() => { localStorage.clear(); window.location.reload(); }} style={{marginTop: '20px', background: 'red', color: 'white', padding: '10px 20px', borderRadius: '8px'}}>Khôi phục / Làm lại từ đầu (Xoá bộ nhớ)</button>
                </div>
            );
        }
        return this.props.children;
    }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);


</script>


    <!-- PURE HTML FLOATING NAV - LOADS INSTANTLY -->
    <nav id="floating-nav-pure" class="fixed bottom-3 sm:bottom-5 left-1/2 -translate-x-1/2 bg-[#383f51] text-[#b3b9cc] px-3 sm:px-6 py-2 sm:py-3 rounded-full flex z-[99999] shadow-[0_10px_30px_rgba(0,0,0,0.3)] items-center text-[9px] sm:text-xs font-black tracking-widest uppercase border border-white/5 divide-x divide-slate-600/50 transition-all scale-85 sm:scale-90 origin-bottom hover:shadow-[0_15px_40px_rgba(0,0,0,0.4)]">
        <button onclick="if(window.self !== window.top){window.parent.postMessage({action:'closeQuiz'},'*');}else if(window.opener){window.close();}else{window.location.href='index.html';}" class="hover:text-white active:scale-95 transition-all flex items-center gap-1.5 sm:gap-2 pr-3 sm:pr-5">
            <i class="fa-solid fa-house text-sm sm:text-lg md:text-xl"></i> Trang Chủ
        </button>
        <button id="btn-luu-pure" onclick="toggleLuuPure(this)" class="active:scale-95 transition-all flex items-center gap-1.5 sm:gap-2 px-3 sm:px-5 hover:text-white">
            <i class="fa-solid fa-heart text-sm sm:text-lg md:text-xl"></i> Lưu
        </button>
        <button id="btn-xong-pure" onclick="toggleXongPure(this)" class="active:scale-95 transition-all flex items-center gap-1.5 sm:gap-2 pl-3 sm:pl-5 hover:text-white">
            <i class="fa-solid fa-circle-check text-sm sm:text-lg md:text-xl"></i> Đã Xong
        </button>
    </nav>
    <script>
        (function() {
            try {
                const u = window.location.pathname.split('/').pop().split('?')[0].split('#')[0];
                const b = JSON.parse(localStorage.getItem('pwa_bookmarks_duocly') || '[]');
                if(b.includes(u)) { document.write('<style>#btn-luu-pure { color: #f43f5e; font-weight: 900; filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.07)); }</style>'); }
                const c = JSON.parse(localStorage.getItem('pwa_completed_duocly') || '[]');
                if(c.includes(u)) { document.write('<style>#btn-xong-pure { color: #34d399; font-weight: 900; filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.07)); }</style>'); }
            } catch(e) {}
        })();
        function toggleLuuPure(btn) {
            try {
                const u = window.location.pathname.split('/').pop().split('?')[0].split('#')[0];
                let b = JSON.parse(localStorage.getItem('pwa_bookmarks_duocly') || '[]');
                let isGhim = false;
                if(!b.includes(u)) { b.push(u); window.customAlert('Đã ghim mốc Dấu Trang!'); isGhim = true; }
                else { b = b.filter(x => x !== u); window.customAlert('Đã hủy Dấu Trang!'); }
                localStorage.setItem('pwa_bookmarks_duocly', JSON.stringify(b));
                if (isGhim) { btn.classList.remove('hover:text-white'); btn.style.color = '#f43f5e'; btn.style.fontWeight = '900'; btn.style.filter = 'drop-shadow(0 4px 3px rgb(0 0 0 / 0.07))'; }
                else { btn.classList.add('hover:text-white'); btn.style.color = ''; btn.style.fontWeight = ''; btn.style.filter = ''; }
            } catch(e) { console.error(e); }
        }
        function toggleXongPure(btn) {
            try {
                const u = window.location.pathname.split('/').pop().split('?')[0].split('#')[0];
                let c = JSON.parse(localStorage.getItem('pwa_completed_duocly') || '[]');
                let isDone = false;
                if(!c.includes(u)) { c.push(u); window.customAlert('Đã đánh dấu bài học này là [Đã Xong]!'); isDone = true; }
                else { c = c.filter(x => x !== u); window.customAlert('Đã bỏ đánh dấu hoàn thành bài học!'); }
                localStorage.setItem('pwa_completed_duocly', JSON.stringify(c));
                if (isDone) { btn.classList.remove('hover:text-white'); btn.style.color = '#34d399'; btn.style.fontWeight = '900'; btn.style.filter = 'drop-shadow(0 4px 3px rgb(0 0 0 / 0.07))'; }
                else { btn.classList.add('hover:text-white'); btn.style.color = ''; btn.style.fontWeight = ''; btn.style.filter = ''; }
            } catch(e) { console.error(e); }
        }
    </script>


<script>
window.customAlert = function(msg) {
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-[999999] flex items-center gap-3 transform transition-all duration-500 translate-y-10 opacity-0 font-bold tracking-wide text-sm border border-slate-700';
    toast.innerHTML = `<i class="fa-solid fa-bell text-rose-400"></i> ${msg}`;
    
    document.body.appendChild(toast);
    
    requestAnimationFrame(() => {
        toast.classList.remove('translate-y-10', 'opacity-0');
    });
    
    setTimeout(() => {
        toast.classList.add('translate-y-10', 'opacity-0');
        setTimeout(() => { if(document.body.contains(toast)) document.body.removeChild(toast); }, 500);
    }, 3000);
};
</script>
